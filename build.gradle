                include 'sodium-neoforge-*.jar'
            }
    ).files
    def sodiumCompileJars = []
    sodiumJars.each { sodiumJar ->
        // Sodium 0.8+ ships renderer + FRAPI classes in META-INF/jarjar/.
        def zf = new java.util.zip.ZipFile(sodiumJar)
        try {
            for (def entry in zf.entries()) {
                if (!entry.name.startsWith('META-INF/jarjar/') || !entry.name.endsWith('.jar')) {
                    continue
                }
                def destName = null
                if (entry.name.endsWith('-mod.jar')) {
                    destName = 'sodium-compile.jar'
                } else if (entry.name.contains('fabric-renderer-api-v1')) {
                    destName = 'sodium-renderer-api.jar'
                }
                if (destName == null) {
                    continue
                }
                def extracted = file("${buildDir}/tmp/${destName}")
                extracted.parentFile.mkdirs()
                zf.getInputStream(entry).withStream { ins ->
                    extracted.withOutputStream { outs -> outs << ins }
                }
                sodiumCompileJars << extracted
            }
        } finally {
            zf.close()
        }
    }
    if (!sodiumCompileJars.isEmpty()) {
        compileOnly files(sodiumCompileJars)
    } else if (!sodiumJars.isEmpty()) {
        compileOnly files(sodiumJars.max { it.lastModified() })
    } else {
        logger.warn('Sodium jar not found for compileOnly; copy sodium-neoforge-*.jar to libs/ to build LambDynamicLights sky-light mixins.')
